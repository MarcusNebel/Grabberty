name: Publish Docker Image

on:
  push:
    branches:
      - backend
      - backend-dev

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push für den Branch "backend-dev"
      - name: Build & Push (backend-dev)
        if: github.ref_name == 'backend-dev'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/marcusnebel/grabberty-backend-dev:latest
            ghcr.io/marcusnebel/grabberty-backend-dev:${{ github.sha }}

      # Build & Push für den Branch "backend"
      - name: Build & Push (backend)
        if: github.ref_name == 'backend'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/marcusnebel/grabberty-backend:latest
            ghcr.io/marcusnebel/grabberty-backend:${{ github.sha }}